[pytest]
asyncio_mode = auto
testpaths = app/tests/api
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Exclude old PostgreSQL-only tests that need a live asyncpg connection
norecursedirs = app/tests/api/v1
log_cli = true
log_cli_level = WARNING
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
